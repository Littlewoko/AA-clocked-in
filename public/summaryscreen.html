<html>

<head>
    <meta charset="UTF-8">
   <title>Summary Screen</title>
    <link rel="stylesheet" href="style.css">

</head>


<body>

 <h1 id="SummaryScreenH1">Summary Screen</h1>

    <div id="SummaryTblSection">

    
<table class="summaryTbl">


        <thead>
            <tr>

                <th>Heading 1</th>
                <th>Time</th>
            </tr>

        </thead>

<tbody>
            
            <tr>

                <td>Start</td>
                <td>9:00</td>
            
            </tr>
            
            <tr>

                <td>End</td>
                <td>15:00</td>
            
            </tr>

            <tr>

                <td>Break Time</td>
                <td>1 Hour</td>
            
            </tr>

            <tr>

                <td>Worked</td>
                <td>5 Hours</td>
            
            </tr>

</tbody>
 
    </table>


</div>


<h3 id="SummaryScreenNotes">Notes</h3>




      <form id="frmNotes">
         
         <textarea rows = "5" cols = "60" name = "notes">
         </textarea>
      </form>

 </div>

<div class="flex-parent btnSection">



        <button class="btnEdit">Edit</button>

        <button class="btnSave">Save</button>



</div>




</body>




</html>
